project:
  name: "MathDB 359102"
  description: >-
    Let H be the Hilbert space under consideration, and let M⊆ H be bounded. The set M is
    **uniformly separated** if _x≠ y∈ M\|x-y\|≠ 0. **Uniform separation conjecture.** If M
    is bounded and uniformly separated, then M is ℓ^1-bounded. This is posed as an open
    question in the paper; no resolution is supplied there.
  authors:
    - "principia"
    - "erichou"
  license: "Apache-2.0"
  responsible_maintainers:
    - "principia"

